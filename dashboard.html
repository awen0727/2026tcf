<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時中獎名單 (V5.2)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg overflow-hidden relative">
        <div class="absolute top-2 right-2 text-xs text-white opacity-50">V5.2</div>
        <div class="bg-red-800 text-white p-4 text-center">
            <h1 class="text-2xl font-bold">中獎榮譽榜</h1>
        </div>
        
        <div class="p-4 border-b">
            <input type="text" id="searchInput" onkeyup="filterData()" placeholder="搜尋號碼..." class="w-full border p-2 rounded text-lg text-center">
        </div>

        <div id="list" class="divide-y max-h-[70vh] overflow-y-auto">
            <div class="p-4 text-center text-gray-500">載入中...</div>
        </div>
    </div>

    <script>
        // ★ 更新後的後台網址
        const API_URL = "https://script.google.com/macros/s/AKfycbx7H9a0eVTLrROF-XBy6oXb2VYMUTaaKzPi2wmQ-lZIUkEVSsYGesCe270nXCG5hOdt/exec";
        
        let allWinners = [];

        function loadData() {
            fetch(API_URL + '?op=getData')
                .then(res => res.json())
                .then(data => {
                    allWinners = data;
                    renderList(data);
                });
        }

        function renderList(data) {
            const list = document.getElementById('list');
            list.innerHTML = "";
            if (data.length === 0) {
                list.innerHTML = "<div class='p-4 text-center text-gray-500'>目前尚未開出獎項</div>";
                return;
            }
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = "p-3 flex justify-between items-center hover:bg-red-50";
                div.innerHTML = `
                    <span class="font-bold text-red-800 text-lg">${item.prize}</span>
                    <div class="text-right">
                        <div class="font-mono text-xl font-bold">${item.num}</div>
                        <div class="text-xs text-gray-400">${item.time}</div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function filterData() {
            const q = document.getElementById('searchInput').value;
            const filtered = allWinners.filter(w => w.num.toString().includes(q));
            renderList(filtered);
        }

        setInterval(loadData, 5000); 
        loadData();
    </script>
</body>
</html>
