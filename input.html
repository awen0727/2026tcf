<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽獎系統後台 (V6.1)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-lg relative">
        <div class="absolute top-2 right-2 text-xs text-gray-300">V6.1</div>
        <h1 class="text-2xl font-bold mb-4 text-center text-red-800">抽獎系統後台</h1>
        
        <div id="loginSection">
            <label class="block mb-2 font-bold">請輸入管理密碼：</label>
            <input type="password" id="password" class="w-full border p-2 rounded mb-4" placeholder="預設: 8888">
            <button onclick="checkPass()" class="w-full bg-red-800 text-white p-2 rounded hover:bg-red-700 font-bold">登入</button>
        </div>

        <div id="adminSection" class="hidden">
            <div class="mb-6">
                <label class="block mb-2 font-bold text-lg">1. 設定抽獎券號碼</label>
                <textarea id="ticketsInput" class="w-full border p-2 rounded h-40 mb-4 bg-gray-50" placeholder="在此貼上..."></textarea>
                <button id="saveBtn" onclick="saveTickets()" class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-500 font-bold text-lg">
                    儲存並重置系統
                </button>
            </div>

            <div class="border-t pt-4 mt-6">
                <label class="block mb-3 font-bold text-lg text-gray-700">2. 系統連結導航</label>
                <div class="grid grid-cols-1 gap-2">
                    <a href="index.html" target="_blank" class="block text-center bg-gray-200 hover:bg-gray-300 text-gray-800 p-2 rounded font-bold">🎛️ 抽獎主控台</a>
                    <a href="lucky.html" target="_blank" class="block text-center bg-green-600 hover:bg-green-700 text-white p-2 rounded font-bold">📺 OBS 直播看板</a>
                    <a href="dashboard.html" target="_blank" class="block text-center bg-yellow-500 hover:bg-yellow-600 text-white p-2 rounded font-bold">📱 手機查榜</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ★ 新網址
        const API_URL = "https://script.google.com/macros/s/AKfycbxwEld6cddUmHShvDNOuZxqeJCIsjxPNwWHdjJovk2OA2nK2yv8LRDelvqqxXcj1BGh/exec";

        function checkPass() {
            if (document.getElementById('password').value === '8888') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminSection').style.display = 'block';
            } else {
                alert('密碼錯誤');
            }
        }

        function saveTickets() {
            const text = document.getElementById('ticketsInput').value.trim();
            if (!text) return alert("請輸入號碼");
            
            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerText;
            btn.disabled = true; btn.innerText = "⏳ 處理中...";

            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            let tickets = [];
            lines.forEach(line => {
                if (line.includes('-')) {
                    const [start, end] = line.split('-').map(Number);
                    if (!isNaN(start) && !isNaN(end) && end >= start) {
                        for (let i = start; i <= end; i++) tickets.push(i.toString());
                    }
                } else {
                    tickets.push(line);
                }
            });

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'setupTickets', tickets: tickets })
            })
            .then(res => res.json())
            .then(data => {
                if (data.result === 'success') {
                    alert(`✅ 設定成功！`);
                    document.getElementById('ticketsInput').value = "";
                } else {
                    alert("❌ 失敗：" + (data.message || "未知錯誤"));
                }
                btn.disabled = false; btn.innerText = originalText;
            })
            .catch(err => {
                alert("錯誤：" + err);
                btn.disabled = false; btn.innerText = originalText;
            });
        }
    </script>
</body>
</html>
