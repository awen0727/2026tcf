<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽獎系統後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-lg">
        <h1 class="text-2xl font-bold mb-4 text-center text-red-800">抽獎系統後台</h1>
        
        <div id="loginSection">
            <label class="block mb-2">請輸入管理密碼：</label>
            <input type="password" id="password" class="w-full border p-2 rounded mb-4">
            <button onclick="checkPass()" class="w-full bg-red-800 text-white p-2 rounded hover:bg-red-700">登入</button>
        </div>

        <div id="adminSection" class="hidden">
            <label class="block mb-2 font-bold">1. 設定抽獎券號碼 (一行一個)</label>
            <textarea id="ticketsInput" class="w-full border p-2 rounded h-40 mb-4" placeholder="415301-415350..."></textarea>
            
            <button id="saveBtn" onclick="saveTickets()" class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-500 font-bold text-lg">
                儲存並重置系統
            </button>
            <p class="text-sm text-gray-500 mt-2 text-center">注意：此操作會清除所有中獎紀錄！</p>
        </div>
    </div>

    <script>
        // ★ 新網址
        const API_URL = "https://script.google.com/macros/s/AKfycbyLlMC7-SnKwSkVic246tHXjyFFaxZLSKHM9Z_cyi-KONKKpStAJ_0zLC7dsEUd9tYz/exec";

        function checkPass() {
            if (document.getElementById('password').value === '8888') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminSection').style.display = 'block';
            } else {
                alert('密碼錯誤');
            }
        }

        function saveTickets() {
            const text = document.getElementById('ticketsInput').value.trim();
            if (!text) return alert("請輸入號碼");
            
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerText = "處理中...";

            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            let tickets = [];

            // 解析範圍 (例如 100-105 轉成 100,101...105)
            lines.forEach(line => {
                if (line.includes('-')) {
                    const [start, end] = line.split('-').map(Number);
                    if (!isNaN(start) && !isNaN(end) && end >= start) {
                        for (let i = start; i <= end; i++) tickets.push(i.toString());
                    }
                } else {
                    tickets.push(line);
                }
            });

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'setupTickets', tickets: tickets })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                btn.disabled = false; btn.innerText = "儲存並重置系統";
            })
            .catch(err => {
                alert("錯誤：" + err);
                btn.disabled = false; btn.innerText = "儲存並重置系統";
            });
        }
    </script>
</body>
</html>
