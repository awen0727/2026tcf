<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS 直播看板 (診斷版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');
        
        body { 
            background-color: #00b140; /* 綠幕背景 */
            font-family: "Microsoft JhengHei", sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            display: flex;
            padding: 20px;
            gap: 20px;
            box-sizing: border-box;
        }

        /* 左側主舞台 */
        .main-stage {
            flex: 3;
            background: rgba(0, 0, 0, 0.8);
            border: 4px solid #ffd700;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .stage-header {
            background: linear-gradient(to bottom, #8b0000, #500000);
            color: #ffd700;
            padding: 15px;
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            border-bottom: 2px solid #ffd700;
        }

        .stage-content {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            overflow-y: auto;
        }

        /* 右側側邊欄 */
        .sidebar {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            background: #333; color: white; padding: 10px; text-align: center; font-weight: bold;
        }
        .sidebar-list { flex-grow: 1; overflow-y: auto; padding: 10px; }

        /* 元素樣式 */
        .single-winner { font-family: 'Oswald', sans-serif; font-size: 12rem; color: #fff; text-shadow: 0 0 20px #ffd700; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; width: 100%; }
        .grid-item { background: #8b0000; color: white; padding: 5px; text-align: center; border-radius: 5px; font-family: 'Oswald', sans-serif; font-size: 1.5rem; }
        .history-item { display: flex; justify-content: space-between; background: rgba(255,255,255,0.9); margin-bottom: 5px; padding: 5px 10px; border-radius: 4px; font-size: 0.9rem; }

        /* 錯誤訊息框 */
        #errorBox {
            display: none; position: absolute; top: 0; left: 0; width: 100%; background: red; color: white; padding: 10px; z-index: 999; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="errorBox"></div>

    <div class="main-stage">
        <div id="stageTitle" class="stage-header">系統連線中</div>
        <div id="stageContent" class="stage-content">
            <div style="color:white; font-size: 2rem;">Loading...</div>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">📜 紀錄</div>
        <div id="historyList" class="sidebar-list"></div>
    </div>

    <script>
        // 全局錯誤攔截 (這會把錯誤顯示在螢幕上)
        window.onerror = function(msg, url, line) {
            const errDiv = document.getElementById('errorBox');
            errDiv.style.display = 'block';
            errDiv.innerHTML = `❌ 發生錯誤 (行號:${line}): ${msg}`;
            return false;
        };

        // 您的 V2.0 網址
        const API_URL = "https://script.google.com/macros/s/AKfycbw3MrRTCbh_Zw-wjeTUmgwEPMN9ifFUnXTXd3k8z_VA5XZy_e6mQ4GMAesaec6rUk60/exec";
        
        let lastUpdateTime = ""; 

        // 啟動循環
        setInterval(updateData, 2000);
        updateData();

        async function updateData() {
            try {
                const res = await fetch(API_URL + '?op=getData');
                const data = await res.json();

                // 狀態 1: 沒有任何資料
                if (!Array.isArray(data) || data.length === 0) {
                    document.getElementById('stageTitle').innerText = "活動準備中";
                    document.getElementById('stageContent').innerHTML = "<div style='color:#ffd700; font-size:3rem; font-weight:bold;'>等待開獎</div>";
                    document.getElementById('historyList').innerHTML = "<div style='color:#ccc; text-align:center;'>尚無紀錄</div>";
                    return;
                }

                // 狀態 2: 有資料，正常顯示
                const latestTime = data[0].time;
                const latestPrize = data[0].prize;
                const currentBatch = data.filter(item => item.time === latestTime && item.prize === latestPrize);
                const historyData = data.slice(currentBatch.length);

                // 更新主舞台 (只有變動時才更新)
                if (latestTime !== lastUpdateTime) {
                    renderStage(latestPrize, currentBatch);
                    lastUpdateTime = latestTime;
                }
                
                // 更新歷史區
                renderSidebar(historyData);

            } catch (err) {
                console.error(err);
                // 這裡不跳紅框，避免網路閃斷一直報錯，只顯示在 Console
            }
        }

        function renderStage(prizeName, winners) {
            const title = document.getElementById('stageTitle');
            const content = document.getElementById('stageContent');
            
            title.innerText = `${prizeName} (${winners.length}名)`;
            content.innerHTML = "";

            if (winners.length === 1) {
                const div = document.createElement('div');
                div.className = 'single-winner';
                div.innerText = winners[0].num;
                content.appendChild(div);
            } else {
                const grid = document.createElement('div');
                grid.className = 'grid-container';
                winners.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'grid-item';
                    item.innerText = p.num;
                    grid.appendChild(item);
                });
                content.appendChild(grid);
            }
        }

        function renderSidebar(data) {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            data.slice(0, 50).forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<span style='color:#8b0000;font-weight:bold;'>${item.prize}</span><span>${item.num}</span>`;
                list.appendChild(div);
            });
        }
    </script>
</body>
</html>
