<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動看板 V3.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');
        
        /* 背景：紅金配色 */
        body { 
            background: radial-gradient(circle, #8b0000 0%, #1a0000 100%);
            font-family: "Microsoft JhengHei", sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            display: flex;
            padding: 20px;
            gap: 20px;
            box-sizing: border-box;
            color: white;
        }

        /* 左側主舞台 */
        .main-stage {
            flex: 3;
            background: rgba(255, 255, 255, 0.05);
            border: 4px solid #ffd700;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .stage-header {
            background: linear-gradient(to right, #8b0000, #d4af37, #8b0000);
            color: #fff;
            padding: 15px;
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            border-bottom: 2px solid #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .stage-content {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* 樣式 A: 單一號碼 (10000元大獎用) */
        .single-winner-num { 
            font-family: 'Oswald', sans-serif; 
            font-size: 14rem; 
            color: #fff; 
            text-shadow: 0 0 30px #ffd700; 
            animation: popUp 0.5s ease-out;
        }

        /* 樣式 B: 僅顯示文字 (500/1000/3000/5000元用) */
        .batch-message-box {
            text-align: center;
            animation: fadeIn 0.8s ease-out;
            background: rgba(0,0,0,0.2);
            padding: 30px 60px;
            border-radius: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }
        .batch-title { font-size: 5rem; font-weight: bold; color: #ffd700; margin-bottom: 20px; }
        .batch-sub { font-size: 2.5rem; color: #fff; }

        /* 右側側邊欄 */
        .sidebar {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            background: rgba(0,0,0,0.6); 
            color: #ffd700; 
            padding: 10px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 1.5rem;
        }
        .sidebar-list { flex-grow: 1; overflow-y: auto; padding: 10px; }

        .history-item { 
            background: rgba(255,255,255,0.1); 
            margin-bottom: 8px; 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 1.1rem; 
            border-left: 4px solid #ffd700;
        }

        /* 版本號 */
        .version-tag {
            position: absolute; bottom: 5px; right: 10px; color: rgba(255,255,255,0.2); font-size: 0.8rem;
        }

        @keyframes popUp { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body>
    <div class="version-tag">System V3.2</div>

    <div class="main-stage">
        <div id="stageTitle" class="stage-header">活動準備中</div>
        <div id="stageContent" class="stage-content">
            <div class="text-white text-3xl opacity-50 animate-pulse">連線中...</div>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">📜 近期開獎</div>
        <div id="historyList" class="sidebar-list"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw3MrRTCbh_Zw-wjeTUmgwEPMN9ifFUnXTXd3k8z_VA5XZy_e6mQ4GMAesaec6rUk60/exec";
        
        let lastChecksum = ""; 

        // 每 2 秒更新一次
        setInterval(updateData, 2000);
        updateData();

        async function updateData() {
            try {
                const res = await fetch(API_URL + '?op=getData');
                const rawData = await res.json();

                if (!Array.isArray(rawData) || rawData.length === 0) {
                    document.getElementById('stageContent').innerHTML = "<div class='text-white text-3xl opacity-50'>等待開獎</div>";
                    return;
                }

                // 取出最新的一筆資料作為代表
                const latest = rawData[0];
                // 產生一個簡單的檢查碼 (時間+獎項)，如果有變動才更新畫面
                const currentChecksum = latest.time + latest.prize;

                if (currentChecksum !== lastChecksum) {
                    // 計算這一批有多少人 (簡單過濾)
                    const count = rawData.filter(r => r.time === latest.time && r.prize === latest.prize).length;
                    
                    renderStage(latest.prize, latest.num, count);
                    
                    // 順便更新側邊欄 (只做簡單渲染)
                    renderSidebar(rawData);
                    
                    lastChecksum = currentChecksum;
                }

            } catch (err) {
                console.error("Error:", err);
            }
        }

        function renderStage(prizeName, winnerNum, count) {
            const title = document.getElementById('stageTitle');
            const content = document.getElementById('stageContent');
            
            title.innerText = prizeName;
            content.innerHTML = "";

            // 邏輯判斷：如果是多人獎項，或者獎項名稱包含 500/1000/3000/5000
            // 只要人數 > 1，就絕對不顯示號碼，避免卡頓
            if (count > 1) {
                // --- 批量模式 (只顯示文字) ---
                const box = document.createElement('div');
                box.className = 'batch-message-box';
                box.innerHTML = `
                    <div class="batch-title">🎉 恭喜獲獎</div>
                    <div class="batch-sub">共 ${count} 位得主</div>
                `;
                content.appendChild(box);
            } else {
                // --- 單人模式 (顯示大號碼) ---
                const div = document.createElement('div');
                div.className = 'single-winner-num';
                div.innerText = winnerNum;
                content.appendChild(div);
                
                const sub = document.createElement('div');
                sub.className = "text-2xl text-yellow-200 mt-4";
                sub.innerText = "🎉 恭喜中獎";
                content.appendChild(sub);
            }
        }

        function renderSidebar(data) {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            
            // 為了不卡頓，我們只抓出「不同的批次」
            // 這裡用一個簡單的方法：只顯示前 10 筆「不重複批次」的紀錄
            
            let shownBatches = 0;
            let lastBatchKey = "";
            
            for (let i = 0; i < data.length; i++) {
                if (shownBatches >= 10) break; // 最多顯示10筆
                
                const item = data[i];
                const key = item.time + item.prize;
                
                // 如果這筆資料跟上一筆是同一批，就跳過 (除了第一筆，第一筆我們已在主畫面顯示，這裡可以選擇要不要顯示)
                // 這裡我們簡單點：只顯示每一批的第一個代表
                if (key !== lastBatchKey) {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    
                    // 這裡不計算 count 了，直接顯示獎項，避免迴圈太重
                    div.innerHTML = `<span style="color:#ffd700;font-weight:bold;">${item.prize}</span> <span style="font-size:0.8em;color:#ccc;">(已開出)</span>`;
                    
                    list.appendChild(div);
                    lastBatchKey = key;
                    shownBatches++;
                }
            }
        }
    </script>
</body>
</html>
