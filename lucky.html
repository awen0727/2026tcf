<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS 直播看板 - 獅子會抽獎</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');
        
        /* OBS 綠幕背景 */
        body { 
            background-color: #00b140; 
            font-family: "Microsoft JhengHei", sans-serif;
            overflow: hidden; 
            height: 100vh;
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        /* 左側：主舞台 (顯示最新那一批結果) */
        .main-stage {
            flex: 3; /* 佔據 3/4 空間 */
            background: rgba(0, 0, 0, 0.8);
            border: 4px solid #ffd700;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .stage-header {
            background: linear-gradient(to bottom, #8b0000, #500000);
            color: #ffd700;
            padding: 15px;
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            border-bottom: 2px solid #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .stage-content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            align-content: center;
        }

        /* 單一大獎樣式 */
        .single-winner {
            font-family: 'Oswald', sans-serif;
            font-size: 14rem;
            color: #fff;
            text-shadow: 0 0 20px #ffd700;
            animation: zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 批量名單格狀樣式 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 15px;
            width: 100%;
        }
        .grid-item {
            background: #8b0000;
            color: white;
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            text-align: center;
            padding: 5px;
            border-radius: 8px;
            border: 1px solid #ffaa00;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            animation: popIn 0.4s ease-out backwards;
        }

        /* 右側：歷史側邊欄 */
        .sidebar {
            flex: 1; /* 佔據 1/4 空間 */
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            background: #333;
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .sidebar-list {
            overflow-y: auto;
            flex-grow: 1;
            padding: 10px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            border-left: 5px solid #8b0000;
        }

        /* 隱藏捲軸 */
        ::-webkit-scrollbar { width: 0px; }

        @keyframes zoomIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="main-stage">
        <div id="stageTitle" class="stage-header">等待開獎...</div>
        <div id="stageContent" class="stage-content">
            <div class="text-gray-400 text-2xl">系統連線中...</div>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">📜 近期紀錄</div>
        <div id="historyList" class="sidebar-list">
            </div>
    </div>

    <script>
        // V2.0 新網址
        const API_URL = "https://script.google.com/macros/s/AKfycbw3MrRTCbh_Zw-wjeTUmgwEPMN9ifFUnXTXd3k8z_VA5XZy_e6mQ4GMAesaec6rUk60/exec";
        
        let lastUpdateTime = ""; 

        // 每 2 秒更新一次
        setInterval(updateData, 2000);
        updateData();

        async function updateData() {
            try {
                const res = await fetch(API_URL + '?op=getData');
                const data = await res.json();

                if (!Array.isArray(data) || data.length === 0) return;

                // 1. 找出「最新一批」的中獎者 (依據時間判斷)
                const latestTime = data[0].time;
                const latestPrize = data[0].prize;
                
                // 篩選出所有時間跟最新一筆相同的人 (視為同一批次)
                // 這裡稍微寬容一點，如果時間只差 1-2 秒也算同一批
                const currentBatch = data.filter(item => item.time === latestTime && item.prize === latestPrize);
                
                // 剩下的就是歷史紀錄
                const historyData = data.slice(currentBatch.length);

                // 2. 更新主舞台 (只有當資料有變動時才重繪，避免一直閃爍)
                if (latestTime !== lastUpdateTime) {
                    renderStage(latestPrize, currentBatch);
                    lastUpdateTime = latestTime;
                }

                // 3. 永遠更新側邊欄 (保持最新)
                renderSidebar(historyData);

            } catch (err) {
                console.error("更新失敗", err);
            }
        }

        function renderStage(prizeName, winners) {
            const title = document.getElementById('stageTitle');
            const content = document.getElementById('stageContent');
            
            title.innerText = `${prizeName} (共${winners.length}名)`;
            content.innerHTML = "";

            if (winners.length === 1) {
                // 單人模式：顯示超大數字
                const div = document.createElement('div');
                div.className = 'single-winner';
                div.innerText = winners[0].num;
                content.appendChild(div);
            } else {
