<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動看板 - 獅子會抽獎</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');
        
        /* 1. 背景調整：改為紅金配色，適合直接投影或放 PPT */
        body { 
            background: radial-gradient(circle, #8b0000 0%, #1a0000 100%);
            font-family: "Microsoft JhengHei", sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            display: flex;
            padding: 20px;
            gap: 20px;
            box-sizing: border-box;
            color: white;
        }

        /* 左側主舞台 */
        .main-stage {
            flex: 3;
            background: rgba(255, 255, 255, 0.05); /* 輕微玻璃質感 */
            border: 4px solid #ffd700;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .stage-header {
            background: linear-gradient(to right, #8b0000, #d4af37, #8b0000);
            color: #fff;
            padding: 15px;
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            border-bottom: 2px solid #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }

        .stage-content {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* 單一大獎樣式 (維持大數字) */
        .single-winner { 
            font-family: 'Oswald', sans-serif; 
            font-size: 15rem; 
            color: #fff; 
            text-shadow: 0 0 30px #ffd700; 
            animation: zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 批量中獎 - 摘要樣式 (解決卡頓問題) */
        .batch-summary-box {
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }
        .batch-icon { font-size: 6rem; margin-bottom: 20px; display: block; }
        .batch-text { font-size: 4rem; font-weight: bold; color: #ffd700; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        .batch-sub { font-size: 2rem; color: #ddd; margin-top: 20px; }

        /* 右側側邊欄 (美化版) */
        .sidebar {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            background: rgba(0,0,0,0.6); 
            color: #ffd700; 
            padding: 15px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 1.5rem;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }
        .sidebar-list { flex-grow: 1; overflow-y: auto; padding: 10px; }

        .history-item { 
            display: flex; 
            justify-content: space-between; 
            background: rgba(255,255,255,0.1); 
            margin-bottom: 8px; 
            padding: 10px 15px; 
            border-radius: 8px; 
            font-size: 1.1rem; 
            border-left: 4px solid #ffd700;
        }
        .h-prize { color: #ffd700; font-weight: bold; }
        .h-num { font-family: 'Oswald', sans-serif; letter-spacing: 1px; }

        @keyframes zoomIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 隱藏捲軸 */
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body>

    <div class="main-stage">
        <div id="stageTitle" class="stage-header">活動準備中</div>
        <div id="stageContent" class="stage-content">
            <div class="text-white text-3xl opacity-50">等待抽獎結果...</div>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">📜 最新榮譽榜</div>
        <div id="historyList" class="sidebar-list">
            </div>
    </div>

    <script>
        // V2.0 網址
        const API_URL = "https://script.google.com/macros/s/AKfycbw3MrRTCbh_Zw-wjeTUmgwEPMN9ifFUnXTXd3k8z_VA5XZy_e6mQ4GMAesaec6rUk60/exec";
        
        let lastUpdateTime = ""; 

        // 每 2 秒檢查一次
        setInterval(updateData, 2000);
        updateData();

        async function updateData() {
            try {
                const res = await fetch(API_URL + '?op=getData');
                const data = await res.json();

                if (!Array.isArray(data) || data.length === 0) {
                    return; // 無資料時保持原狀
                }

                const latestTime = data[0].time;
                const latestPrize = data[0].prize;
                const currentBatch = data.filter(item => item.time === latestTime && item.prize === latestPrize);
                
                // 排除這一批之後的資料作為歷史
                const historyData = data.slice(currentBatch.length);

                // 更新主舞台
                if (latestTime !== lastUpdateTime) {
                    renderStage(latestPrize, currentBatch);
                    lastUpdateTime = latestTime;
                }
                
                // 更新側邊欄
                renderSidebar(historyData);

            } catch (err) {
                console.error("Fetch error:", err);
            }
        }

        function renderStage(prizeName, winners) {
            const title = document.getElementById('stageTitle');
            const content = document.getElementById('stageContent');
            
            title.innerText = prizeName; // 標題只顯示獎項名稱，保持簡潔
            content.innerHTML = "";

            if (winners.length === 1) {
                // 情境 A：單抽 (顯示大數字)
                const div = document.createElement('div');
                div.className = 'single-winner';
                div.innerText = winners[0].num;
                content.appendChild(div);
                
                // 下方加註恭喜
                const sub = document.createElement('div');
                sub.className = "text-2xl text-yellow-200 mt-4";
                sub.innerText = "恭喜獲獎";
                content.appendChild(sub);

            } else {
                // 情境 B：批量抽 (顯示摘要，不顯示 90 個數字)
                // 這解決了卡頓問題，也讓畫面更乾淨
                const box = document.createElement('div');
                box.className = 'batch-summary-box';
                
                box.innerHTML = `
                    <div class="batch-icon">🎉</div>
                    <div class="batch-text">恭喜 ${winners.length} 位得主</div>
                    <div class="batch-sub">中獎名單已同步至總覽看板</div>
                `;
                content.appendChild(box);
            }
        }

        function renderSidebar(data) {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            
            if (data.length === 0) {
                list.innerHTML = "<div class='text-center text-gray-400 mt-4'>尚無紀錄</div>";
                return;
            }

            // 只顯示最近 20 筆歷史，讓畫面乾淨
            data.slice(0, 20).forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                // 這裡的文字改小一點，只顯示獎項+號碼
                div.innerHTML = `
                    <span class="h-prize">${item.prize}</span>
                    <span class="h-num">${item.num}</span>
                `;
                list.appendChild(div);
            });
        }
    </script>
</body>
</html>
