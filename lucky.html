<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直播特效頁 - 獅子會抽獎</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');
        
        /* OBS 綠幕背景 */
        body { 
            background-color: #00b140; 
            font-family: "Microsoft JhengHei", sans-serif;
            overflow: hidden; 
            height: 100vh;
        }

        /* 左側大數字特效 */
        .big-num {
            font-family: 'Oswald', sans-serif;
            font-size: 10rem;
            color: #fff;
            text-shadow: 4px 4px 0 #000;
            line-height: 1;
        }
        .prize-title {
            color: #ffd700;
            text-shadow: 2px 2px 0 #000;
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* 右側列表樣式 */
        .list-container {
            background: rgba(0, 0, 0, 0.6); /* 半透明黑底，方便閱讀 */
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .list-header {
            background: #8b0000;
            color: white;
            padding: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            border-bottom: 2px solid gold;
        }
        .list-body {
            overflow-y: auto;
            padding: 10px;
            flex-grow: 1;
        }
        /* 隱藏捲軸但保留功能 */
        .list-body::-webkit-scrollbar { width: 0px; }

        /* 單筆名單卡片 */
        .winner-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            margin-bottom: 10px;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            animation: slideIn 0.5s ease-out;
        }
        .w-prize { color: #8b0000; font-weight: bold; font-size: 1.2rem; }
        .w-num { font-family: 'Oswald', sans-serif; font-size: 1.5rem; color: #000; }
        .w-time { font-size: 0.8rem; color: #666; }

        @keyframes slideIn {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body class="p-10 flex gap-10 items-center justify-center">

    <div class="w-2/3 flex flex-col justify-center items-center text-center">
        <div class="bg-black/20 p-10 rounded-3xl backdrop-blur-sm border border-white/20 shadow-2xl">
            <div class="text-white text-2xl mb-2 opacity-80">Latest Winner</div>
            <div id="latestPrize" class="prize-title">等待開獎...</div>
            <div id="latestNum" class="big-num">------</div>
            <div id="latestTime" class="text-white mt-4 text-xl"></div>
        </div>
    </div>

    <div class="w-1/3">
        <div class="list-container">
            <div class="list-header">🏆 中獎榮譽榜</div>
            <div id="winnerList" class="list-body">
                </div>
        </div>
    </div>

    <script>
        // 使用您最新的 V2.0 網址
        const API_URL = "https://script.google.com/macros/s/AKfycbw3MrRTCbh_Zw-wjeTUmgwEPMN9ifFUnXTXd3k8z_VA5XZy_e6mQ4GMAesaec6rUk60/exec";
        
        let lastDataLength = 0; // 用來偵測有沒有新資料

        // 每 3 秒自動更新一次
        setInterval(updateData, 3000);
        updateData(); // 頁面載入時先執行一次

        async function updateData() {
            try {
                // 使用 op=getData 參數抓取所有中獎名單
                const res = await fetch(API_URL + '?op=getData');
                const data = await res.json();

                if (!Array.isArray(data) || data.length === 0) return;

                // 更新左側大字 (最新的那一筆)
                const latest = data[0]; // 因為後端已經排過序，第0筆就是最新的
                document.getElementById('latestPrize').innerText = latest.prize;
                document.getElementById('latestNum').innerText = latest.num;
                document.getElementById('latestTime').innerText = `開獎時間: ${latest.time}`;

                // 如果資料變多了，代表有新中獎者，重新渲染列表
                if (data.length !== lastDataLength) {
                    renderList(data);
                    lastDataLength = data.length;
                }

            } catch (err) {
                console.error("更新失敗", err);
            }
        }

        function renderList(data) {
            const list = document.getElementById('winnerList');
            list.innerHTML = ""; // 清空舊的

            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'winner-card';
                div.innerHTML = `
                    <div>
                        <div class="w-prize">${item.prize}</div>
                        <div class="w-time">${item.time}</div>
                    </div>
                    <div class="w-num">${item.num}</div>
                `;
                list.appendChild(div);
            });
        }
    </script>
</body>
</html>
