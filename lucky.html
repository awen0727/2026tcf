<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS 直播看板 - 獅子會抽獎</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');
        
        body { 
            background-color: #00b140; /* OBS 綠幕 */
            font-family: "Microsoft JhengHei", sans-serif;
            overflow: hidden; 
            height: 100vh;
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        /* 左側：主舞台 */
        .main-stage {
            flex: 3;
            background: rgba(0, 0, 0, 0.8);
            border: 4px solid #ffd700;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .stage-header {
            background: linear-gradient(to bottom, #8b0000, #500000);
            color: #ffd700;
            padding: 15px;
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            border-bottom: 2px solid #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .stage-content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            align-content: center;
        }

        /* 單一大獎樣式 */
        .single-winner {
            font-family: 'Oswald', sans-serif;
            font-size: 14rem;
            color: #fff;
            text-shadow: 0 0 20px #ffd700;
            animation: zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 批量名單格狀樣式 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 15px;
            width: 100%;
        }
        .grid-item {
            background: #8b0000;
            color: white;
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            text-align: center;
            padding: 5px;
            border-radius: 8px;
            border: 1px solid #ffaa00;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            animation: popIn 0.4s ease-out backwards;
        }

        /* 右側：歷史側邊欄 */
        .sidebar {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            background: #333;
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .sidebar-list {
            overflow-y: auto;
            flex-grow: 1;
            padding: 10px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            border-left: 5px solid #8b0000;
        }

        /* 隱藏捲軸 */
        ::-webkit-scrollbar { width: 0px; }

        @keyframes zoomIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
